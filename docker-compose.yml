services:

  # App контейнер (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: ./docker-compose/backend/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    tty: true
    # Процессы (php-fpm, exec-команды) работают от uid/gid хостового пользователя,
    # чтобы файлы в bind-маунте не становились root'овыми
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www
    environment:
      # Включение xdebug: XDEBUG_MODE=debug в .env или export перед docker compose up
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - .:/var/www
      - ./docker-compose/backend/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      db:
        condition: service_healthy
    networks:
      - realtracker

  # Планировщик (php artisan schedule:work): бэкапы и прочие задачи из routes/console.php.
  # Тот же образ, что у app; xdebug выключен принудительно, чтобы отладка из .env
  # не подвешивала ночные задачи.
  scheduler:
    build:
      context: .
      dockerfile: ./docker-compose/backend/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www
    command: php artisan schedule:work
    environment:
      XDEBUG_MODE: "off"
    volumes:
      - .:/var/www
      - ./docker-compose/backend/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      db:
        condition: service_healthy
    networks:
      - realtracker

  # Nginx контейнер для вебсервера
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    tty: true
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - realtracker

  # MySQL контейнер
  db:
    image: mysql:8.4
    restart: unless-stopped
    tty: true
    ports:
      # Наружу торчит только на localhost, чтобы не светить БД по сети
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_USER: '${DB_USERNAME}'
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker-compose/mysql/my.cnf:/etc/mysql/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - realtracker

  # Vite dev-сервер с HMR (docker compose --profile dev up)
  vite:
    build:
      context: .
      dockerfile: ./docker-compose/nodejs/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    tty: true
    profiles:
      - dev
    ports:
      - "${VITE_PORT:-5173}:5173"
    working_dir: /var/www
    command: sh -c "npm ci && npm run dev:serve"
    volumes:
      - .:/var/www
    networks:
      - realtracker

  # Разовая сборка ассетов для prod (docker compose --profile build run --rm assets)
  assets:
    build:
      context: .
      dockerfile: ./docker-compose/nodejs/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    profiles:
      - build
    working_dir: /var/www
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/var/www
    networks:
      - realtracker

networks:
  realtracker:
    driver: bridge

# Тома
volumes:
  # Чтобы данные БД не пропадали после выключения создаем именованный том
  dbdata:
