cgi.fix_pathinfo=0

post_max_size = 256M
upload_max_filesize = 256M

max_execution_time = 1000
max_input_time = 1000

output_buffering = 4096

; xdebug.mode задается через переменную окружения XDEBUG_MODE в docker-compose.yml.
; Для отладки: XDEBUG_MODE=debug в .env, IDE должна слушать порт 9003.
xdebug.client_host = host.docker.internal
xdebug.discover_client_host = 1
xdebug.start_with_request = yes
xdebug.log_level = 0
